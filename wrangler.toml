name = "shaktiq-auth-gate"
main = "worker.js"
compatibility_date = "2024-09-23"

# KV Namespace binding: stores tokens, rate limits, and the question bank
[[kv_namespaces]]
binding = "SHAKTIQ_KV"
id = "17ca16b05ae440b38265f65b6115ee50"

# Cloudflare Workers AI: Run open-source AI models (Meta Llama 3.2 3B, Gemma 7B) natively & serverless
[ai]
binding = "AI"
